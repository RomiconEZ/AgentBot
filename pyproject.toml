[tool.poetry]
name = "customer-bot-karelia-tour"
version = "0.1.0"
description = "Part of the contact center automation service"
authors = ["Roman Neronov <roman.nieronov@gmail.com>"]
license = "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
sqlalchemy = "^2.0.43"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
aiohttp = "^3.12.15"
icecream = "^2.1.5"

[tool.poetry.group.bot.dependencies]
aiogram = "^3.20.0"
asyncpg = "^0.30.0"
redis = "^6.4.0"
loguru = "^0.7.3"
sentry-sdk = {extras = ["loguru"], version = "^2.34.1"}
aiohttp = {extras = ["speedups"], version = "^3.12.15"}
uvloop = "^0.21.0"
babel = "^2.17.0"
cachetools = "^6.1.0"
orjson = "^3.11.1"
alembic = "^1.16.4"
prometheus-client = "^0.22.1"

[tool.poetry.group.admin.dependencies]
gunicorn = "^23.0.0"
flask = "^3.1.1"
flask-admin = "^1.6.1"
flask-security-too = "^5.6.2"
flask-caching = "^2.3.1"
flask-babel = "^4.0.0"
flask-sqlalchemy = "^3.1.1"
psycopg2-binary = "^2.9.10"
tablib = {extras = ["xlsx"], version = "^3.8.0"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.8"
mypy = "^1.17.1"
pre-commit = "^4.3.0"
black = "^25.1.0"
isort = "^6.0.1"

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
select = ["ALL"]
ignore = ["D", "ANN101", "ANN102", "ANN401", "TD003", "FIX002", "COM812", "ISC001", "FBT001", "FBT002", "RUF", "ERA", "ARG005"]
cache-dir = "/tmp/ruff-cache/"
extend-exclude = ["logs", "configs", "migrations"]

[tool.ruff.isort]
no-lines-before = ["future", "standard-library"]
known-local-folder = ["bot", "admin"]

[tool.ruff.extend-per-file-ignores]
"tests/*.py" = ["ANN401", "S101", "S311"]

[tool.mypy]
python_version = "3.10"
files = "bot/*.py"
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
show_error_context = true
pretty = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports_for_stubs = true
namespace_packages = true
show_absolute_path = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
